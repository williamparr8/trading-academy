# Publie le simulateur sur GitHub Pages à chaque push sur main.
# Le déploiement échoue si un test du moteur échoue.
name: Tests et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tests du moteur, du coach et du classement
        run: node tools/test-engine.mjs

      - name: Construire le site
        run: node tools/build-pages.mjs

      - name: Préparer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deployer:
    name: Déployer sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v5
